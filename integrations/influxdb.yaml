# Influx DB

influxdb:
  # username: !secret influx_username
  # password: !secret influx_password
  tags:
    source: HA
  tags_attributes:
    - friendly_name
  default_measurement: state
  exclude:
    entities:
      - zone.home
    domains:
      - persistent_notification
      - person
      - automation
      - script
      - update
  include:
    domains:
      - sensor
      - binary_sensor
      - sun
    entities:
      - weather.bergstedt