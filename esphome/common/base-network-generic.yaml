---

# common/base-network-generic.yaml

# Web Server
web_server:
  port: !secret web_server_port
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

# Wifi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # domain: !secret domain
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Setup ${friendly_devicename}"
    password: !secret fallback_hotspot_password
    #manual_ip:
      #static_ip: !secret fallback_hotspot_static_ip
      #gateway: !secret fallback_hotspot_gateway
      #subnet: !secret fallback_hotspot_subnet

