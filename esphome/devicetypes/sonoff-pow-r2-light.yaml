---

# devicetypes/sonoff-pow-r2-light.yaml

binary_sensor:
  - platform: gpio
    id: pow_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_devicename} Button State"
    on_press:
      - light.toggle: relay

output:
  - platform: gpio
    id: relay_output
    pin: GPIO12

light:
  - platform: binary
    id: relay
    name: ${relay_name}
    icon: ${relay_icon}
    output: relay_output
    on_turn_on:
      - light.turn_on: led
    on_turn_off:
      - light.turn_off: led

