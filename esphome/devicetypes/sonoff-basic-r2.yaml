# devicetypes/sonoff-basic-r2.yaml

esp8266:
  board: esp8285

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Button"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: ${friendly_devicename}
    id: relay
    icon: mdi:power
    pin: GPIO12

status_led:
  pin:
    number: GPIO13
    inverted: yes