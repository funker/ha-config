# sensor/mh-rd.yaml

esphome:
  on_boot:
    priority: -10
    then:
      - script.execute: test_resistance
      - script.execute: measure_loop

globals:
  - id: measure_delay
    type: int
    restore_value: yes
    initial_value: '${measure_interval_dry}'

text_sensor:
  - platform: template
    id: text_status
    name: "${friendly_devicename} Status"
    lambda: |-
      return {"Watching"};

binary_sensor:
  - platform: template
    id: raining
    name: "${friendly_devicename} Raining"
    device_class: moisture

  - platform: template
    id: drying
    name: "${friendly_devicename} Drying"
    device_class: moisture

sensor:
  - platform: adc
    id: source_sensor
    pin: ${adc_pin}
    internal: true

    # A low update interval helps the measurement settle correctly while
    # the bias voltage is active and works well with the median filter.
    update_interval: 250ms

    filters:
      - multiply: 0.846153
      - median:
          window_size: 7
          send_every: 4
          send_first_at: 3

  - platform: resistance
    id: real_resistance_sensor
    sensor: source_sensor
    configuration: DOWNSTREAM
    resistor: ${resistor_value}
    reference_voltage: 3.3V
    internal: true
    icon: mdi:omega
    filters:
      # Clamp to the configured range.
      - lambda: 'return max((float)${min_resistance}, x);'
      - lambda: 'return min((float)${max_resistance}, x);'
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return id(real_resistance_sensor).state > ${min_resistance}
                  &&
                  // <= is intentional so that max_resistance is still published
                  // and can be compared against later drops in resistance.
                  id(real_resistance_sensor).state <= ${max_resistance};
            then:
              - sensor.template.publish:
                  id: resistance_sensor
                  state: !lambda "return id(real_resistance_sensor).state;"

  - platform: template
    id: latest_resistance_sensor
    name: "${friendly_devicename} Latest Resistance"
    icon: mdi:omega
    unit_of_measurement: "Ω"

  - platform: template
    id: latest_average_resistance_sensor
    name: "${friendly_devicename} Latest Average Resistance"
    icon: mdi:omega
    unit_of_measurement: "Ω"

  - platform: template
    id: resistance_sensor
    name: "${friendly_devicename} Resistance"
    icon: mdi:omega
    unit_of_measurement: "Ω"

  - platform: template
    id: average_resistance_sensor
    name: "${friendly_devicename} Average Resistance"
    icon: mdi:omega
    unit_of_measurement: "Ω"
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15

button:
  - platform: template
    id: run_measure
    name: "${friendly_devicename} Run Measure"
    on_press:
      - script.execute: measure

switch:
  - platform: gpio
    id: resistance_bias
    name: "${friendly_devicename} Resistance Bias"
    icon: mdi:power
    pin:
      number: ${bias_pin}
      mode: OUTPUT
    restore_mode: ALWAYS_OFF

script:
  - id: begin_measure
    mode: single
    then:
      - switch.turn_on: resistance_bias
      - delay: ${stabilization_delay}

  - id: end_measure
    mode: single
    then:
      - switch.turn_off: resistance_bias

  - id: save_current_resistance
    mode: single
    then:
      - sensor.template.publish:
          id: latest_resistance_sensor
          state: !lambda "return id(resistance_sensor).state;"
      - sensor.template.publish:
          id: latest_average_resistance_sensor
          state: !lambda "return id(average_resistance_sensor).state;"

  - id: update_average_values
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(resistance_sensor).state >= 0
                && id(resistance_sensor).state <= ${max_resistance};
          then:
            - sensor.template.publish:
                id: average_resistance_sensor
                state: !lambda "return id(resistance_sensor).state;"

  - id: its_raining
    mode: single
    then:
      - logger.log: "It's raining!"
      - script.execute: save_current_resistance
      - script.wait: save_current_resistance
      - homeassistant.event:
          event: esphome.its_raining
      - text_sensor.template.publish:
          id: text_status
          state: "Raining"
      - binary_sensor.template.publish:
          id: raining
          state: ON
      - binary_sensor.template.publish:
          id: drying
          state: OFF
      - globals.set:
          id: measure_delay
          value: '${measure_interval_wet}'

  - id: its_drying
    mode: single
    then:
      - logger.log: "It's drying!"
      - script.execute: save_current_resistance
      - script.wait: save_current_resistance
      - text_sensor.template.publish:
          id: text_status
          state: "Drying"
      - binary_sensor.template.publish:
          id: raining
          state: OFF
      - binary_sensor.template.publish:
          id: drying
          state: ON
      - globals.set:
          id: measure_delay
          value: '${measure_interval_wet}'

  - id: its_dry
    mode: single
    then:
      - logger.log: "It's dry!"
      - script.execute: save_current_resistance
      - script.wait: save_current_resistance
      - text_sensor.template.publish:
          id: text_status
          state: "Dry"
      - binary_sensor.template.publish:
          id: raining
          state: OFF
      - binary_sensor.template.publish:
          id: drying
          state: OFF
      - globals.set:
          id: measure_delay
          value: '${measure_interval_dry}'

  - id: test_resistance
    mode: single
    then:
      - script.execute: begin_measure
      - script.wait: begin_measure
      - if:
          condition:
            lambda: 'return id(resistance_sensor).state < ${wet_resistance_when_booting};'
          then:
            - script.execute: its_raining
      - script.execute: end_measure
      - script.wait: end_measure

  - id: measure
    mode: single
    then:
      - script.execute: begin_measure
      - script.wait: begin_measure

      - if:
          condition:
            lambda: 'return isnan(id(latest_resistance_sensor).state);'
          then:
            - script.execute: save_current_resistance
            - script.wait: save_current_resistance

      - if:
          condition:
            lambda: 'return isnan(id(latest_average_resistance_sensor).state);'
          then:
            - script.execute: save_current_resistance
            - script.wait: save_current_resistance

      - logger.log:
          level: INFO
          format: "> Resistance: %.1f vs latest resistance: %.1f"
          args: ['id(resistance_sensor).state', 'id(latest_resistance_sensor).state']

      - script.execute: update_average_values
      - script.wait: update_average_values

      - if:
          condition:
            lambda: 'return id(resistance_sensor).state + ${rain_detection_threshold} < id(latest_resistance_sensor).state;'
          then:
            - script.execute: its_raining

      - if:
          condition:
            lambda: 'return id(average_resistance_sensor).state - ${dry_detection_threshold} > id(latest_average_resistance_sensor).state;'
          then:
            - script.execute: its_drying

      - if:
          condition:
            lambda: 'return id(resistance_sensor).state == ${max_resistance};'
          then:
            - script.execute: its_dry

      - script.execute: end_measure
      - script.wait: end_measure

  - id: measure_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - logger.log:
                level: INFO
                format: "[Start measure]"
            - script.execute: measure
            - script.wait: measure
            - delay: !lambda "return id(measure_delay);"