substitutions:
  devicename: "esp8266-02"
  friendly_devicename: "Kamin"
  room: "Esszimmer"
  comment: "Kamin"
  project_name: "Wemos.D1 Mini ESP8266"
  project_version: "1.0"
  # dallas_address: "0xcc3c620457962328"

  max6675_update_interval: 10s

  spi_miso_pin: D0
  spi_clk_pin: D1
  max6675_cs_pin: D8

  temperature_threshold: "40.0"

  # dallas_pin_number: D4

<<: !include devicetypes/esp8266-d1-mini_v2.yaml

esphome:
  <<: !include common/section-esphome.yaml

<<: !include common/section-system.yaml

# SPI für MAX6675 Thermoelement
spi:
  miso_pin: ${spi_miso_pin}
  clk_pin: ${spi_clk_pin}

sensor:
  - <<: !include common/sensor/uptime.yaml
  - <<: !include common/sensor/wifi_signal.yaml

  # MAX6675 Thermoelement
  - <<: !include common/sensor/max6675.yaml

text_sensor:
  - <<: !include common/text_sensor/version.yaml

binary_sensor:
  - <<: !include common/binary_sensor/status.yaml
  - platform: template
    name: "Zustand"
    id: zustand
    icon: mdi:fireplace
    lambda: |-
      if (id(max6675_temperature).state > ${temperature_threshold}) {
        return true;
      } else {
        return false;
      }


button:
  - <<: !include common/button/restart.yaml