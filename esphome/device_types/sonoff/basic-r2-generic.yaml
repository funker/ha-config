---

# device_types/sonoff/basic-r2-generic.yaml

packages:
  base_network_esp: !include ../../common/base-network-esp.yaml
  relay_control: !include ../../components/relay-control.yaml

esp8266:
  board: esp8285
  restore_from_flash: true

binary_sensor:
  - platform: gpio
    id: basic_r2_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_devicename} Button State"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(enable_button_global);
          then:
            - if:
                condition:
                  lambda: |-
                    return id(allow_turn_off_global) || !id(relay_state);
                then:
                  - switch.toggle: button_switch
                else:
                  - switch.turn_on: button_switch

output:
  - platform: gpio
    id: relay_output
    pin: GPIO12

  - platform: esp8266_pwm
    id: device_status_led
    pin:
      number: GPIO13
      inverted: true

