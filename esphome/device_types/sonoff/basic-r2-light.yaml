---

# device_types/sonoff/basic-r2-light.yaml

packages:
  generic: !include basic-r2-generic.yaml

light:
  - platform: binary
    id: relay
    name: ${relay_name}
    icon: ${relay_icon}
    output: relay_output
    on_turn_on:
      - switch.turn_on: button_switch
    on_turn_off:
      - switch.turn_off: button_switch

