# esp32-03.yaml

substitutions:
  # Default substitutions
  config_tested_date: "2026-06-02"
  devicename: "esp32-03"
  friendly_devicename: "Fan-Controller"
  room: "Datacenter"
  comment: "Serverschrank Fan-Controller"
  project_name: "Espressif.ESP32"
  project_version: "1.0"

# Throttle writing parameters to the internal flash memory to reduce ESP memory wear / degradation
preferences:
  flash_write_interval: 15min

packages:
  # Basic configuration
  - !include common/section-esphome.yaml
  - !include common/section-system.yaml
  # Default components
  - !include components/binary_sensor.yaml
  - !include components/button.yaml
  - !include components/sensor.yaml
  - !include components/text_sensor.yaml
  - !include components/switch.yaml
  # Device type
  - !include devicetypes/esp32-generic.yaml
  - !include roles/fan-controller.yaml

